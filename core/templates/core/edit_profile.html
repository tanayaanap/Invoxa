{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        Edit Profile
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                First Name
                            </label>
                            {{ form.first_name }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Last Name
                            </label>
                            {{ form.last_name }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>
                            {{ form.email }}
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'profile' %}" class="btn btn-secondary">

                                Cancel

                            </a>

                            <button class="btn btn-primary">

                                Save Changes

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
