{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Record Payment</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <!-- Invoice -->
                <div class="mb-3">

                    <label class="form-label">
                        Invoice
                    </label>

                    {{ form.invoice }}

                </div>

                <!-- Customer -->

                <div class="mb-3">

                    <label class="form-label">
                        Customer
                    </label>

                    <input
                        type="text"
                        id="customer"
                        class="form-control"
                        readonly>

                </div>

                <!-- Amount -->

                <div class="mb-3">

                    <label class="form-label">
                        Invoice Total
                    </label>

                    <input
                        type="text"
                        id="amount"
                        class="form-control"
                        readonly>

                </div>

                <!-- Status -->

                <div class="mb-3">

                    <label class="form-label">
                        Current Status
                    </label>

                    <input
                        type="text"
                        id="status"
                        class="form-control"
                        readonly>

                </div>

                <!-- Payment Method -->

                <div class="mb-3">

                    <label class="form-label">
                        Payment Method
                    </label>

                    {{ form.payment_method }}

                </div>

                <!-- Reference Number -->

                <div class="mb-3">

                    <label class="form-label">
                        Transaction / Reference Number
                    </label>

                    {{ form.reference_number }}

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Record Payment

                </button>

                <a
                    href="{% url 'payment_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

    const invoiceSelect =
        document.getElementById("id_invoice");

    invoiceSelect.addEventListener("change", function(){

        const invoiceId = this.value;

        if(!invoiceId){

            document.getElementById("customer").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("status").value = "";

            return;

        }

        fetch(`/payments/invoice/${invoiceId}/`)

        .then(response => response.json())

        .then(data => {

            document.getElementById("customer").value =
                data.customer;

            document.getElementById("amount").value =
                "₹ " + data.amount;

            document.getElementById("status").value =
                data.status;

        });

    });

});

</script>

{% endblock %}
