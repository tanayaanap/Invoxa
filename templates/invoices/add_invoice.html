{% extends "base.html" %}

{% block content %}

<div class="container-fluid p-3 p-md-4">

    <div class="card shadow border-0">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Create Invoice
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row g-3 mb-4">

                    <div class="col-12 col-lg-6">

                        <label class="form-label fw-semibold">
                            Customer
                        </label>

                        {{ form.customer }}

                    </div>

                    <div class="col-12 col-lg-6">

                        <label class="form-label fw-semibold">
                            Due Date
                        </label>

                        {{ form.due_date }}

                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h5 class="mb-0">
                        Products
                    </h5>

                    <button
                        type="button"
                        id="addRow"
                        class="btn btn-success btn-sm">

                        <i class="bi bi-plus-circle"></i>
                        Add Product

                    </button>

                </div>

                <div class="table-responsive">

                    <table class="table table-bordered align-middle">

                        <thead class="table-light">

                            <tr>

                                <th style="min-width:220px;">Product</th>
                                <th style="min-width:110px;">Quantity</th>
                                <th style="min-width:130px;">Price</th>
                                <th style="min-width:130px;">Total</th>
                                <th style="min-width:80px;">Action</th>

                            </tr>

                        </thead>

                        <tbody id="productBody">

                            <tr class="product-row">

                                <td>

                                    <select
                                        name="product[]"
                                        class="form-select product-select">

                                        <option value="">
                                            Select Product
                                        </option>

                                        {% for product in products %}

                                        <option
                                            value="{{ product.id }}"
                                            data-price="{{ product.price }}">

                                            {{ product.name }}

                                        </option>

                                        {% endfor %}

                                    </select>

                                </td>

                                <td>

                                    <input
                                        type="number"
                                        name="quantity[]"
                                        class="form-control quantity"
                                        value="1"
                                        min="1">

                                </td>

                                <td>

                                    <input
                                        type="text"
                                        name="price[]"
                                        class="form-control price"
                                        readonly>

                                </td>

                                <td>

                                    <input
                                        type="text"
                                        name="total[]"
                                        class="form-control total"
                                        readonly>

                                </td>

                                <td class="text-center">

                                    <button
                                        type="button"
                                        class="btn btn-danger btn-sm remove-row">

                                        <i class="bi bi-trash"></i>

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="text-end mt-4">

                    <h4>

                        Grand Total :

                        <span id="grandTotal" class="text-primary">

                            ₹0.00

                        </span>

                    </h4>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="bi bi-check-circle"></i>

                        Save Invoice

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

const productOptions = `
<option value="">Select Product</option>
{% for product in products %}
<option value="{{ product.id }}" data-price="{{ product.price }}">
{{ product.name }}
</option>
{% endfor %}
`;

function calculateGrandTotal(){

    let grandTotal = 0;

    document.querySelectorAll(".total").forEach(function(input){

        grandTotal += Number(input.value || 0);

    });

    document.getElementById("grandTotal").innerHTML =
        "₹ " + grandTotal.toFixed(2);

}

function attachEvents(row){

    const select = row.querySelector(".product-select");
    const qty = row.querySelector(".quantity");
    const price = row.querySelector(".price");
    const total = row.querySelector(".total");
    const removeBtn = row.querySelector(".remove-row");

    select.addEventListener("change", function(){

        let selectedPrice =
            this.options[this.selectedIndex].dataset.price || 0;

        price.value = selectedPrice;

        total.value =
            (Number(selectedPrice) * Number(qty.value)).toFixed(2);

        calculateGrandTotal();

    });

    qty.addEventListener("input", function(){

        total.value =
            (Number(price.value || 0) * Number(this.value)).toFixed(2);

        calculateGrandTotal();

    });

    removeBtn.addEventListener("click", function(){

        if(document.querySelectorAll(".product-row").length > 1){

            row.remove();

            calculateGrandTotal();

        }

    });

}

attachEvents(document.querySelector(".product-row"));

document.getElementById("addRow").addEventListener("click", function(){

    let tbody = document.getElementById("productBody");

    let row = document.createElement("tr");

    row.classList.add("product-row");

    row.innerHTML = `

        <td>

            <select
                name="product[]"
                class="form-select product-select">

                ${productOptions}

            </select>

        </td>

        <td>

            <input
                type="number"
                name="quantity[]"
                class="form-control quantity"
                value="1"
                min="1">

        </td>

        <td>

            <input
                type="text"
                name="price[]"
                class="form-control price"
                readonly>

        </td>

        <td>

            <input
                type="text"
                name="total[]"
                class="form-control total"
                readonly>

        </td>

        <td class="text-center">

            <button
                type="button"
                class="btn btn-danger btn-sm remove-row">

                <i class="bi bi-trash"></i>

            </button>

        </td>

    `;

    tbody.appendChild(row);

    attachEvents(row);

});

</script>

{% endblock %}
