{% extends "base.html" %}

{% block content %}

<div class="container-fluid p-4">

    <div class="card shadow">

        <div class="card-header">
            <h3>Create Invoice</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row mb-4">

                    <div class="col-md-6">

                        <label class="form-label">
                            Customer
                        </label>

                        {{ form.customer }}

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Due Date
                        </label>

                        {{ form.due_date }}

                    </div>

                </div>

                <hr>

                <h5 class="mb-3">Products</h5>

                <table class="table table-bordered">

                    <thead>

                        <tr>

                            <th>Product</th>
                            <th width="120">Quantity</th>
                            <th width="150">Price</th>
                            <th width="150">Total</th>
                            <th width="80">Action</th>

                        </tr>

                    </thead>

                    <tbody id="productBody">

                        <tr class="product-row">

                            <td>

                                <select
                                    name="product[]"
                                    class="form-select product-select">

                                    <option value="">Select Product</option>

                                    {% for product in products %}

                                    <option
                                        value="{{ product.id }}"
                                        data-price="{{ product.price }}">

                                        {{ product.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </td>

                            <td>

                                <input
                                    type="number"
                                    name="quantity[]"
                                    class="form-control quantity"
                                    value="1"
                                    min="1">

                            </td>

                            <td>

                                <input
                                    type="text"
                                    name="price[]"
                                    class="form-control price"
                                    readonly>

                            </td>

                            <td>

                                <input
                                    type="text"
                                    name="total[]"
                                    class="form-control total"
                                    readonly>

                            </td>

                            <td>

                                <button
                                    type="button"
                                    class="btn btn-danger remove-row">

                                    X

                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

                <button
                    type="button"
                    id="addRow"
                    class="btn btn-success">

                    + Add Product

                </button>

                <hr>

                <div class="text-end">

                    <h5>

                        Grand Total :
                        <span id="grandTotal">

                            ₹0

                        </span>

                    </h5>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary mt-3">

                    Save Invoice

                </button>

            </form>

        </div>

    </div>

</div>

<script>

const productOptions = `
<option value="">Select Product</option>
{% for product in products %}
<option value="{{ product.id }}" data-price="{{ product.price }}">
{{ product.name }}
</option>
{% endfor %}
`;

function calculateGrandTotal(){

    let grandTotal = 0;

    document.querySelectorAll(".total").forEach(function(input){

        grandTotal += Number(input.value || 0);

    });

    document.getElementById("grandTotal").innerHTML =
        "₹ " + grandTotal.toFixed(2);

}

function attachEvents(row){

    const select = row.querySelector(".product-select");
    const qty = row.querySelector(".quantity");
    const price = row.querySelector(".price");
    const total = row.querySelector(".total");
    const removeBtn = row.querySelector(".remove-row");

    select.addEventListener("change", function(){

        let selectedPrice =
            this.options[this.selectedIndex].dataset.price || 0;

        price.value = selectedPrice;

        total.value =
            (Number(selectedPrice) * Number(qty.value)).toFixed(2);

        calculateGrandTotal();

    });

    qty.addEventListener("input", function(){

        total.value =
            (Number(price.value || 0) * Number(this.value)).toFixed(2);

        calculateGrandTotal();

    });

    removeBtn.addEventListener("click", function(){

        if(document.querySelectorAll(".product-row").length > 1){

            row.remove();

            calculateGrandTotal();

        }

    });

}

attachEvents(document.querySelector(".product-row"));

document.getElementById("addRow").addEventListener("click", function(){

    let tbody = document.getElementById("productBody");

    let row = document.createElement("tr");

    row.classList.add("product-row");

    row.innerHTML = `

        <td>

            <select
                name="product[]"
                class="form-select product-select">

                ${productOptions}

            </select>

        </td>

        <td>

            <input
                type="number"
                name="quantity[]"
                class="form-control quantity"
                value="1"
                min="1">

        </td>

        <td>

            <input
                type="text"
                name="price[]"
                class="form-control price"
                readonly>

        </td>

        <td>

            <input
                type="text"
                name="total[]"
                class="form-control total"
                readonly>

        </td>

        <td>

            <button
                type="button"
                class="btn btn-danger remove-row">

                X

            </button>

        </td>

    `;

    tbody.appendChild(row);

    attachEvents(row);

});

</script>

{% endblock %}
