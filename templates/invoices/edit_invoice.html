{% extends "base.html" %}

{% block content %}

<div class="container-fluid p-4">

    <div class="card shadow">

        <div class="card-header">

            <h3>Edit Invoice</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Customer
                    </label>

                    {{ form.customer }}

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    {{ form.status }}

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Update Invoice

                </button>

                <a
                    href="{% url 'invoice_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
